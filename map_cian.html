<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Избранные квартиры — Циан и Авито, Санкт-Петербург</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/cards.css">
    <link rel="stylesheet" href="./css/rating.css">
    <link rel="stylesheet" href="./css/sort.css">
    <link rel="stylesheet" href="./css/markers.css">
    <link rel="stylesheet" href="./css/gallery.css">
</head>
<body>
    <div id="map"></div>
    <div id="list">
        <div class="list-top-row">
            <div class="list-search-header">
                <label class="list-search-label">Быстрый поиск по тексту карточки</label>
                <div class="list-search-row">
                    <input type="text" id="list-search-input" class="list-search-input" placeholder="Адрес, метро, цена...">
                    <button type="button" id="list-search-clear" class="list-search-clear" title="Очистить">✕</button>
                </div>
            </div>
            <div class="sort-controls">
                <label for="list-sort-select" class="sort-label">Сортировка:</label>
                <select id="list-sort-select" class="sort-select">
                <optgroup label="Рейтинг">
                    <option value="rating-desc">По рейтингу (лучшие сверху)</option>
                    <option value="rating-asc">По рейтингу (худшие сверху)</option>
                </optgroup>
                <optgroup label="Суммарный балл">
                    <option value="composite-desc">Суммарный балл (лучшие сверху)</option>
                    <option value="composite-asc">Суммарный балл (худшие сверху)</option>
                </optgroup>
                <optgroup label="Цена">
                    <option value="price-asc">По цене (дешевле сначала)</option>
                    <option value="price-desc">По цене (дороже сначала)</option>
                </optgroup>
                <optgroup label="Цена за м²">
                    <option value="price_per_sqm-asc">По цене за м² (дешевле)</option>
                    <option value="price_per_sqm-desc">По цене за м² (дороже)</option>
                </optgroup>
                <optgroup label="Площадь">
                    <option value="area-asc">По площади (меньше сначала)</option>
                    <option value="area-desc">По площади (больше сначала)</option>
                </optgroup>
                <optgroup label="Этаж">
                    <option value="floor-asc">По этажу (ниже сначала)</option>
                    <option value="floor-desc">По этажу (выше сначала)</option>
                </optgroup>
                <optgroup label="Год">
                    <option value="build_year-asc">По году (старые сначала)</option>
                    <option value="build_year-desc">По году (новые сначала)</option>
                </optgroup>
                <optgroup label="Комнаты">
                    <option value="rooms-asc">По кол-ву комнат (меньше сначала)</option>
                    <option value="rooms-desc">По кол-ву комнат (больше сначала)</option>
                </optgroup>
            </select>
        </div>
        <div class="sidebar-filters-compact">
            <div class="filter-line" id="rooms-filter" role="group" aria-label="Фильтр по комнатности">
                <span class="filter-line-key" title="Комнаты">К</span>
                <label class="filter-chip"><input type="checkbox" data-rooms="1" checked><span>1</span></label>
                <label class="filter-chip"><input type="checkbox" data-rooms="2" checked><span>2</span></label>
                <label class="filter-chip"><input type="checkbox" data-rooms="3" checked><span>3</span></label>
                <label class="filter-chip"><input type="checkbox" data-rooms="4" checked><span>4+</span></label>
                <label class="filter-chip"><input type="checkbox" data-rooms="0" checked><span>?</span></label>
            </div>
            <div class="filter-line" id="rating-filter" role="group" aria-label="Фильтр по оценке">
                <span class="filter-line-key" title="Оценки">О</span>
                <label class="filter-chip filter-chip-green"><input type="checkbox" data-rating-filter="3" checked><span class="filter-chip-emoji" title="Отлично">👍</span></label>
                <label class="filter-chip filter-chip-yellow"><input type="checkbox" data-rating-filter="2" checked><span class="filter-chip-emoji" title="Хорошо">😐</span></label>
                <label class="filter-chip filter-chip-red"><input type="checkbox" data-rating-filter="1" checked><span class="filter-chip-emoji" title="Плохо">👎</span></label>
                <label class="filter-chip filter-chip-closed"><input type="checkbox" data-rating-filter="4" checked><span class="filter-chip-emoji" title="Дорога закрыта">🚫</span></label>
                <label class="filter-chip filter-chip-none"><input type="checkbox" data-rating-filter="0" checked><span class="filter-chip-emoji" title="Не оценено">—</span></label>
            </div>
        </div>
        <div class="copy-rating-toolbar" role="group" aria-label="Копировать ID в hidden_ids по оценке">
            <span class="copy-rating-label">ID в буфер:</span>
            <div class="copy-rating-btns">
                <button type="button" class="copy-rating-btn copy-rating-btn-green" id="copy-rating-3" title="Отлично — ID Циан и Авито для NEWLY_HIDDEN_IDS">👍</button>
                <button type="button" class="copy-rating-btn copy-rating-btn-yellow" id="copy-rating-2" title="Хорошо">😐</button>
                <button type="button" class="copy-rating-btn copy-rating-btn-red" id="copy-rating-1" title="Плохо">👎</button>
                <button type="button" class="copy-rating-btn copy-rating-btn-closed" id="copy-rating-4" title="Дорога закрыта">🚫</button>
            </div>
            <span class="copy-rating-feedback" id="copy-rating-feedback" aria-live="polite"></span>
        </div>
        </div>
        <div class="list-cards" id="list-cards"></div>
    </div>

    <div id="gallery-modal">
        <div class="modal-header">
            <div class="modal-header-text">
                <span class="modal-title" id="gallery-title"></span>
                <span class="modal-subtitle" id="gallery-subtitle"></span>
            </div>
            <button class="modal-close" id="gallery-close">Закрыть</button>
        </div>
        <div class="modal-body">
            <div id="gallery-slider-wrap">
                <div id="gallery-slider">
                    <div class="slider-img-wrap">
                        <img id="gallery-img" src="" alt="">
                        <span class="slider-zone slider-zone-prev" aria-hidden="true"><span class="slider-arrow"></span></span>
                        <span class="slider-zone slider-zone-next" aria-hidden="true"><span class="slider-arrow"></span></span>
                    </div>
                    <div class="slider-nav">
                        <div class="slider-nav-left">
                            <button type="button" id="gallery-prev">← Назад</button>
                            <span class="slider-counter" id="gallery-counter">1 / 1</span>
                            <button type="button" id="gallery-next">Вперёд →</button>
                        </div>
                        <a id="gallery-link" class="modal-link modal-link-footer" href="#" target="_blank">Открыть на Циан</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="./data/apartments.js"></script>
    <script src="./data/hidden_ids.js"></script>
    <script src="./data/metro_spb.js"></script>
    <script src="./js/rating_presets.js"></script>
    <script src="./js/rating.js"></script>
    <script src="./js/gallery.js"></script>
    <script src="./js/map.js"></script>
    <script src="./js/list.js"></script>
    <script src="./js/copy-rating-ids.js"></script>
    <script>
        (function () {
            var full = window.APARTMENTS || [];
            window.RATING_PRESET_BY_URL =
                typeof buildRatingPresetByUrl === 'function' ? buildRatingPresetByUrl(full) : {};
            window.APARTMENTS_ALL = full.slice();
            var mode;
            try { mode = localStorage.getItem('cian_visibility_mode') || 'visible'; } catch (e) { mode = 'visible'; }
            /** Скрытие по списку: Циан (sale/flat/id) и Авито (avito_id / хвост URL …_id). */
            function getCianFlatId(a) {
                var u = a.url || '';
                if (u.indexOf('cian.ru') === -1) return null;
                var m = u.match(/sale\/flat\/(\d+)/);
                return m ? m[1] : null;
            }
            function getAvitoItemId(a) {
                if (a.avito_id != null && a.avito_id !== '') return String(a.avito_id);
                var u = a.url || '';
                if (u.indexOf('avito.') === -1 && a.source !== 'avito') return null;
                var m = u.match(/_(\d+)(?:\?.*)?$/);
                return m ? m[1] : null;
            }
            function makeHiddenSet(ids) {
                var s = {};
                (ids || []).forEach(function (x) {
                    s[String(x)] = true;
                });
                return s;
            }
            var hiddenFull = window.APARTMENT_HIDDEN_IDS || [];
            var hiddenBase = window.APARTMENT_HIDDEN_IDS_BASE || [];
            var idsToHide = mode === 'all' ? [] : (mode === 'visible_plus_newly' ? hiddenBase : hiddenFull);
            var hideSet = makeHiddenSet(idsToHide);
            window.APARTMENTS = idsToHide.length
                ? full.filter(function (a) {
                    var cid = getCianFlatId(a);
                    if (cid && hideSet[cid]) return false;
                    var aid = getAvitoItemId(a);
                    if (aid && hideSet[aid]) return false;
                    return true;
                })
                : full;
            window.CIAN_VISIBILITY_MODE = mode;
            var forMap =
                typeof filterApartmentsForMap === 'function'
                    ? filterApartmentsForMap(window.APARTMENTS)
                    : filterApartmentsByRooms(window.APARTMENTS);
            initMap(forMap);
            initGallery();
            initList();
            if (typeof initCopyRatingIdsToolbar === 'function') initCopyRatingIdsToolbar();
        })();
    </script>
</body>
</html>
